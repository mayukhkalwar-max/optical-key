<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optical Smart Key Mobile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px;
            touch-action: manipulation;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .header h2 { margin: 0; font-size: 20px; color: #0088ff; }
        .header p { margin: 5px 0 0; font-size: 12px; color: #888; }
        
        #flash-box {
            width: 85vw;
            height: 85vw;
            max-width: 320px;
            max-height: 320px;
            background-color: #111111;
            border: 4px solid #333333;
            border-radius: 20px;
            transition: background-color 0.05s linear;
        }
        
        .controls {
            width: 100%;
            max-width: 320px;
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #007bff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
            cursor: pointer;
        }
        button:active { background-color: #0056b3; transform: scale(0.98); }
        #status { margin-top: 12px; font-size: 13px; color: #aaa; word-break: break-all; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Optical Smart Key</h2>
        <p>Align flash box with lock sensor</p>
    </div>

    <div id="flash-box"></div>

    <div class="controls">
        <button id="tx-btn" onclick="transmitToken()">Transmit Optical Key</button>
        <div id="status">Status: Ready</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
