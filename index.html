<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optical Flashlight Key</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .header { text-align: center; }
        .header h2 { margin: 0; font-size: 22px; color: #ffbb00; }
        .header p { margin: 6px 0 0; font-size: 13px; color: #aaa; }
        
        #flash-icon {
            font-size: 80px;
            margin: auto 0;
            filter: drop-shadow(0 0 10px rgba(255, 187, 0, 0.2));
            transition: transform 0.1s ease;
        }
        
        .controls { width: 100%; max-width: 320px; text-align: center; }
        button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            background-color: #ffbb00;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 187, 0, 0.3);
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; }
        #status { margin-top: 14px; font-size: 13px; color: #bbb; word-break: break-all; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Optical Flashlight Key</h2>
        <p>Point phone's rear camera flashlight at the lock sensor</p>
    </div>

    <div id="flash-icon">⚡</div>

    <div class="controls">
        <button id="tx-btn" onclick="transmitToken()">Transmit Flashlight Token</button>
        <div id="status">Status: Tap to Initialize Torch</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
