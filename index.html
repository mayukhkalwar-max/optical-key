<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Smart Lock Transmitter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #flash-box {
            width: 250px;
            height: 250px;
            background-color: black;
            border: 4px solid #333;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        button {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div id="flash-box"></div>
    <button onclick="transmitToken()">Transmit Optical Key</button>
    <div id="status">Status: Idle</div>

    <script src="app.js"></script>
</body>
</html>
