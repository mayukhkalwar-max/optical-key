<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Receiver Simulator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h2 { margin-top: 0; color: #58a6ff; }
        p { color: #8b949e; text-align: center; font-size: 14px; margin-bottom: 20px; }

        .sensor-card {
            width: 100%;
            max-width: 380px;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .photodiode-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #000000;
            border: 4px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: all 0.05s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #lock-status {
            width: 100%;
            max-width: 380px;
            padding: 16px;
            margin-top: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            transition: all 0.2s ease;
        }

        #lock-status.unlocked {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.6);
        }

        #lock-status.invalid {
            background: #da3633;
            color: #ffffff;
            border-color: #f85149;
        }

        .dashboard {
            width: 100%;
            max-width: 380px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .stat-val { font-family: monospace; font-weight: bold; color: #79c0ff; }
    </style>
</head>
<body>

    <h2>Optical Receiver Simulator</h2>
    <p>Open transmitter in another tab and click Transmit!</p>

    <div class="sensor-card">
        <div id="sensor" class="photodiode-box">📡</div>
        <div style="font-size: 13px; color: #8b949e;">Virtual Photodiode Sensor</div>
    </div>

    <div id="lock-status">LOCKED 🔒</div>

    <div class="dashboard">
        <div class="stat-card">
            <span>Signal State:</span>
            <span id="signal-state" class="stat-val">OFF (0)</span>
        </div>
        <div class="stat-card">
            <span>Live Buffer:</span>
            <span id="buffer-val" class="stat-val">...</span>
        </div>
        <div class="stat-card">
            <span>Decoded Key:</span>
            <span id="decoded-key" class="stat-val">NONE</span>
        </div>
    </div>

    <script src="receiver.js"></script>
</body>
</html>
