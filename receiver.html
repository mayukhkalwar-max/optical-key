<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optical Receiver Simulator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
        }
        h2 { margin: 8px 0; color: #58a6ff; font-size: 20px; }
        p { margin: 0 0 12px; color: #8b949e; font-size: 13px; text-align: center; }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 270px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #30363d;
            background: #000;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .target-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border: 3px dashed #00ff66;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
            pointer-events: none;
        }

        canvas { display: none; }

        .dashboard {
            width: 100%;
            max-width: 360px;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .stat-value { font-family: monospace; font-weight: bold; color: #79c0ff; }

        #lock-status {
            width: 100%;
            max-width: 360px;
            padding: 16px;
            margin-top: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            background: #21262d;
            color: #8b949e;
            border: 1px solid #30363d;
            transition: all 0.2s ease;
            white-space: pre-line;
        }

        #lock-status.unlocked {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.6);
        }

        #lock-status.invalid {
            background: #da3633;
            color: #ffffff;
            border-color: #f85149;
        }

        button {
            width: 100%;
            max-width: 360px;
            padding: 14px;
            margin-top: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background-color: #238636;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-reset { background-color: #30363d; }
    </style>
</head>
<body>

    <h2>Optical Receiver Simulator</h2>
    <p>Align the flashing light inside the green target box</p>

    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="target-box"></div>
    </div>

    <canvas id="analyzer-canvas"></canvas>

    <div id="lock-status">LOCKED 🔒</div>

    <div class="dashboard">
        <div class="stat-card">
            <span>Light Level:</span>
            <span id="light-val" class="stat-value">0</span>
        </div>
        <div class="stat-card">
            <span>Adaptive Threshold:</span>
            <span id="thresh-val" class="stat-value">0</span>
        </div>
        <div class="stat-card">
            <span>Detected Bit:</span>
            <span id="bit-val" class="stat-value">-</span>
        </div>
        <div class="stat-card">
            <span>Buffer Stream:</span>
            <span id="buffer-val" class="stat-value">...</span>
        </div>
    </div>

    <button id="start-btn" onclick="startReceiver()">Start Camera Receiver</button>
    <button class="btn-reset" onclick="calibrateNoise()">Reset / Calibrate Light</button>

    <script src="receiver.js"></script>
</body>
</html>
