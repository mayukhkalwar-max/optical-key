<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Receiver Smart Lock</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%; max-width: 480px;
            background: #141a23; padding: 24px;
            border-radius: 20px; border: 1px solid #232d3f;
            text-align: center;
        }
        video { width: 100%; height: 200px; border-radius: 12px; background: #000; object-fit: cover; }
        canvas { display: none; }
        .data-card {
            background: #0d1117; padding: 12px; border-radius: 10px;
            margin: 10px 0; border: 1px solid #21262d; font-family: monospace;
        }
        #lock-status {
            font-size: 20px; font-weight: bold; margin-top: 15px;
            padding: 12px; border-radius: 10px; background: #1c2333;
        }
        .unlocked { background: #0e3a1e !important; color: #39d353; }
        .invalid { background: #3a0e0e !important; color: #f85149; }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Optical Receiver</h2>
    
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="data-card">Signal: <span id="signal-state">IDLE</span></div>
    <div class="data-card">Bit Stream: <span id="buffer-val">Waiting...</span></div>
    <div class="data-card">Decoded Token: <span id="decoded-key">NONE</span></div>

    <div id="lock-status">LOCKED 🔒</div>
</div>

<script src="receiver.js"></script>
</body>
</html>
